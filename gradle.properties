# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Deliberately NOT enabling org.gradle.parallel: combined with viewBinding,
# it triggers a known Gradle/Kotlin-plugin project-state-lock race during
# compileDebugKotlin. Not worth the speed gain on a project this size.

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official